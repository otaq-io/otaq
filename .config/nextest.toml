# cargo-nextest settings for `cargo nextest run --workspace`, the `test` step of scripts/check.sh (decision 0056,
# SDD §23.2). Each test runs in its own process, in parallel, as many at once as the machine has cores.
#
# No test groups. The tests that time a terminal or a child process (the PTY sessions, `project_terminals`, the
# terminal typing test) passed in every one of about 80 runs of the whole suite at full
# parallelism on a 16-core Mac (2026-10-17). The few tests that failed now and then were waits too short for a busy
# machine, fixed in the tests rather than given fewer threads: limiting every service test to 8 or 12 at once made a
# run 10-35% slower and didn't stop those failures.

[profile.default]
# Every failure in one run, not just the first.
fail-fast = false
# No retries: a test that passes only sometimes is a bug to fix, not something to retry.
retries = 0
# A test still running after 5 minutes is killed and fails, with its output. The slowest test takes about 2 minutes on
# GitHub's Linux runner; with no limit, a deadlocked test (agent_tools.install, 2026-10-22) held every run for 6 hours.
slow-timeout = { period = "60s", terminate-after = 5 }
