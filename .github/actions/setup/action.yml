# The machine every Checks job starts from, on Linux and on Windows: the system libraries Tauri builds against (Linux
# only), Rust, cargo-nextest, Node and the caches. Each job then runs its own groups of scripts/check.sh (Linux) or
# scripts\check.ps1 (Windows). On Windows, Git for Windows (whose `bash`, `sh` and `cat` these steps and the tests
# run) and the MSVC build tools come with the runner; steps only Windows needs go under `runner.os == 'Windows'`.
#
# On Windows the cargo target folder and the temporary folder (TMP, TEMP: every test's data folder, database and git
# repository) live on a Dev Drive, a ReFS volume Defender scans asynchronously: the tests' file I/O is what makes them
# 25-50x slower on Windows than on Linux (tuq/tech-specs/faster-pr-checks.md, Decision 2). The drive is mounted at a
# fixed folder beside the checkout, not a drive letter, so CARGO_TARGET_DIR (part of the Rust cache's key) is the same
# in every run and the cache's `workspaces` can name it relative to the checkout.
name: Set up the checks
description: System libraries (Linux), Rust 1.99.0, cargo-nextest, Node 24, the caches and a git identity
inputs:
  save-rust-cache:
    description: Whether this job saves the Rust cache (only one of jobs that build the same thing should)
    default: "true"
runs:
  using: composite
  steps:
    # As in scripts/README.md (Linux VM, step 1).
    - name: Install system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config file \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
          libssl-dev libdbus-1-dev libnotify-bin
    - name: Make the Dev Drive's mount folder
      if: runner.os == 'Windows'
      shell: pwsh
      run: New-Item -ItemType Directory -Force -Path '${{ github.workspace }}\..\dev-drive' | Out-Null
    # Dynamic: the file grows only as far as the build and the tests fill it.
    - uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
      if: runner.os == 'Windows'
      with:
        drive-size: 40GB
        drive-type: Dynamic
        mount-path: ${{ github.workspace }}\..\dev-drive
    - name: Put the build and temporary folders on the Dev Drive
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $drive = $env:DEV_DRIVE
        New-Item -ItemType Directory -Force -Path "$drive\target", "$drive\tmp" | Out-Null
        "CARGO_TARGET_DIR=$drive\target" >> $env:GITHUB_ENV
        "TMP=$drive\tmp" >> $env:GITHUB_ENV
        "TEMP=$drive\tmp" >> $env:GITHUB_ENV
        # Smaller PDBs and faster links; backtraces keep file and line.
        "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> $env:GITHUB_ENV
        "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> $env:GITHUB_ENV
    - name: Install Rust 1.99.0
      shell: bash
      run: |
        rustup toolchain install 1.99.0 --profile minimal -c rustfmt -c clippy
        rustup default 1.99.0
    - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
      with:
        tool: cargo-nextest
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: crates/otaq-desktop/.nvmrc
        cache: npm
        cache-dependency-path: crates/otaq-desktop/package-lock.json
    # One cache per job and system (the key holds the job's name and the runner's OS): clippy's and the tests' builds
    # don't share files.
    # On Windows the target folder is the Dev Drive's (above); `workspaces` is `<checkout> -> <target, relative to it>`.
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ inputs.save-rust-cache }}
        workspaces: ${{ runner.os == 'Windows' && '. -> ../dev-drive/target' || '.' }}
    # The core tests commit into temporary git repositories.
    - name: Set a git identity
      shell: bash
      run: |
        git config --global user.name "Otaq CI"
        git config --global user.email "ci@otaq.invalid"
