# Runs every step of scripts/check.sh on Linux and of scripts/check.ps1 on Windows for every pull request and every
# push to main (d0056), then approves the maintainer's own pull requests once the Linux checks pass, so they can merge
# with `gh pr merge --rebase --auto` (d0107, d0116). The Windows job doesn't block a merge yet: some tests still fail
# there (Q601). macOS joins later; until then it's checked locally.
#
# On Linux the steps run as parallel jobs, each one group of check.sh: the frontend steps, fmt and clippy, and the
# tests in two shares (the doc examples with the first). Together they are the same steps as a plain
# `scripts/check.sh`. On Windows check.ps1 runs whole, in one job (it has no groups).
#
# release.yml runs this workflow too (`workflow_call`) before it builds a release.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Checks (Linux) – frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: scripts/check.sh frontend

  lint:
    name: Checks (Linux) – fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: scripts/check.sh lint

  # A test still running after 5 minutes fails (.config/nextest.toml), so a job never waits out the time limit on a
  # hang. Both shares build the same test programs: only the first saves the Rust cache.
  test:
    name: Checks (Linux) – tests ${{ matrix.share }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - share: 1
            groups: test doctest
          - share: 2
            groups: test
    env:
      CARGO_TERM_COLOR: always
      CHECK_TEST_PARTITION: hash:${{ matrix.share }}/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          save-rust-cache: ${{ matrix.share == 1 }}
      - run: scripts/check.sh ${{ matrix.groups }}

  # The same machine as .github/actions/setup, which is Linux only (apt-get), set up step by step: Rust 1.99.0,
  # cargo-nextest, Node 24, the Rust cache and a git identity. Git for Windows, whose `sh` and `cat` the tests run, and
  # the MSVC build tools come with the runner. Tests that only make sense on Unix are `#[cfg(unix)]` (Q598). check.ps1
  # fetches Microsoft's ConPTY from nuget.org (scripts/conpty.ps1, pinned and hash-checked) for the tests' sessions.
  # Not required until the Windows failures of Q601 are fixed: a red run shows on the pull request without failing
  # the workflow, and the approve job doesn't wait for it.
  windows:
    name: Checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.99.0
        run: |
          rustup toolchain install 1.99.0 --profile minimal -c rustfmt -c clippy
          rustup default 1.99.0
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/otaq-desktop/.nvmrc
          cache: npm
          cache-dependency-path: crates/otaq-desktop/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The core tests commit into temporary git repositories.
      - name: Set a git identity
        run: |
          git config --global user.name "Otaq CI"
          git config --global user.email "ci@otaq.invalid"
      - run: powershell -ExecutionPolicy Bypass -File scripts\check.ps1

  # Approves only pull requests an admin opened from a branch of this repository. Organization admins have admin
  # rights on every repository, so the repository's own permission check covers them. A fork's run gets a read-only
  # token, so it couldn't approve even if this check were wrong.
  approve:
    name: Approve an admin's pull request
    needs: [frontend, lint, test]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission)"
          if [ "$permission" != "admin" ]; then
            echo "$AUTHOR isn't an admin ($permission): the pull request waits for an admin's review."
            exit 0
          fi
          gh pr review "$PR_URL" --approve --body "Checks (Linux) passed."
