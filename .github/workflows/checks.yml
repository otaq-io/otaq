# Runs every step of scripts/check.sh on Linux for every pull request and every push to main (d0056), then approves
# the maintainer's own pull requests once the checks pass, so they can merge with `gh pr merge --rebase --auto`
# (d0107, d0116). macOS and Windows join later; until then they're checked locally.
#
# The steps run as parallel jobs, each one group of check.sh: the frontend steps, fmt and clippy, and the tests in two
# shares (the doc examples with the first). Together they are the same steps as a plain `scripts/check.sh`.
#
# release.yml runs this workflow too (`workflow_call`) before it builds a release.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Checks (Linux) – frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: scripts/check.sh frontend

  lint:
    name: Checks (Linux) – fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: scripts/check.sh lint

  # A test still running after 5 minutes fails (.config/nextest.toml), so a job never waits out the time limit on a
  # hang. Both shares build the same test programs: only the first saves the Rust cache.
  test:
    name: Checks (Linux) – tests ${{ matrix.share }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - share: 1
            groups: test doctest
          - share: 2
            groups: test
    env:
      CARGO_TERM_COLOR: always
      CHECK_TEST_PARTITION: hash:${{ matrix.share }}/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          save-rust-cache: ${{ matrix.share == 1 }}
      - run: scripts/check.sh ${{ matrix.groups }}

  # Approves only pull requests an admin opened from a branch of this repository. Organization admins have admin
  # rights on every repository, so the repository's own permission check covers them. A fork's run gets a read-only
  # token, so it couldn't approve even if this check were wrong.
  approve:
    name: Approve an admin's pull request
    needs: [frontend, lint, test]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission)"
          if [ "$permission" != "admin" ]; then
            echo "$AUTHOR isn't an admin ($permission): the pull request waits for an admin's review."
            exit 0
          fi
          gh pr review "$PR_URL" --approve --body "Checks (Linux) passed."
