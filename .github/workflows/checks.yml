# Runs every step of scripts/check.sh on Linux and of scripts/check.ps1 on Windows for every pull request and every
# push to main (d0056), then approves the maintainer's own pull requests once both pass, so they can merge with
# `gh pr merge --rebase --auto` (d0107, d0116). macOS joins later; until then it's checked locally.
#
# Both systems run the same parallel jobs, each one group of the check script: the frontend steps, lint (fmt and
# clippy) and the tests in shares (the doc examples with the first share). Together they are the same steps as a
# plain `scripts/check.sh` or `scripts\check.ps1`. Each job is a matrix over Linux and Windows; the test shares are one
# `include` list, the only place their count is written (tuq/tech-specs/faster-pr-checks.md, Decision 1).
#
# release.yml runs this workflow too (`workflow_call`) before it builds a release.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Checks (${{ matrix.os.name }}) – frontend
    runs-on: ${{ matrix.os.runner }}
    # A Windows job running this long is a hang, not a slow step.
    timeout-minutes: ${{ matrix.os.name == 'Windows' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - { name: Linux, runner: ubuntu-latest }
          - { name: Windows, runner: windows-latest }
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - if: runner.os == 'Linux'
        run: scripts/check.sh frontend
      - if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts\check.ps1 frontend

  lint:
    name: Checks (${{ matrix.os.name }}) – lint
    runs-on: ${{ matrix.os.runner }}
    timeout-minutes: ${{ matrix.os.name == 'Windows' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - { name: Linux, runner: ubuntu-latest }
          - { name: Windows, runner: windows-latest }
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - if: runner.os == 'Linux'
        run: scripts/check.sh lint
      - if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts\check.ps1 lint

  # The one list of test shares: CHECK_TEST_PARTITION is built from it, never written by hand. A test still running
  # after 5 minutes fails (.config/nextest.toml), so a job never waits out the time limit on a hang. Every share of a
  # system builds the same test programs: only share 1 saves that system's Rust cache (its key holds the system).
  # Tests that only make sense on Unix are `#[cfg(unix)]` (Q598); check.ps1 fetches Microsoft's ConPTY from nuget.org
  # (scripts/conpty.ps1, pinned and hash-checked) for the tests' sessions.
  test:
    name: Checks (${{ matrix.name }}) – tests ${{ matrix.share }}/${{ matrix.shares }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.name == 'Windows' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, runner: ubuntu-latest, share: 1, shares: 2, groups: test doctest }
          - { name: Linux, runner: ubuntu-latest, share: 2, shares: 2, groups: test }
          - { name: Windows, runner: windows-latest, share: 1, shares: 4, groups: test doctest }
          - { name: Windows, runner: windows-latest, share: 2, shares: 4, groups: test }
          - { name: Windows, runner: windows-latest, share: 3, shares: 4, groups: test }
          - { name: Windows, runner: windows-latest, share: 4, shares: 4, groups: test }
    env:
      CARGO_TERM_COLOR: always
      CHECK_TEST_PARTITION: hash:${{ matrix.share }}/${{ matrix.shares }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          save-rust-cache: ${{ matrix.share == 1 }}
      - if: runner.os == 'Linux'
        run: scripts/check.sh ${{ matrix.groups }}
      - if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts\check.ps1 ${{ matrix.groups }}

  # Approves only pull requests an admin opened from a branch of this repository. Organization admins have admin
  # rights on every repository, so the repository's own permission check covers them. A fork's run gets a read-only
  # token, so it couldn't approve even if this check were wrong.
  approve:
    name: Approve an admin's pull request
    needs: [frontend, lint, test]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission)"
          if [ "$permission" != "admin" ]; then
            echo "$AUTHOR isn't an admin ($permission): the pull request waits for an admin's review."
            exit 0
          fi
          gh pr review "$PR_URL" --approve --body "Checks (Linux and Windows) passed."
