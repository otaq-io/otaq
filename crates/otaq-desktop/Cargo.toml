[package]
name = "otaq-desktop"
description = "Otaq desktop app on Tauri 2: a React + TypeScript page built with Vite (d0074, d0075)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Where the frontend sits (SDD §5.5 implementation choice): inside this crate. `package.json`, the npm lock file and
# the TypeScript / ESLint / Prettier / Vite configs sit next to this file; the page itself is in `ui/` (`ui/index.html`,
# `ui/src/`), and Vite builds it into `ui/dist/`, which `tauri.conf.json` names as `frontendDist`. One folder holds
# everything the app is made of, and `npm` commands run from here. See README.md.

# The binary keeps the name the GPUI app had (d0075 point 8.5, T-0245), so `otaq` launches it
# (`naming::app_binary_name()`) and the release archive's layout (d0072) stays as it was. The crate keeps its own name.
[[bin]]
name = "otaq-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde_json = "1.0.151"
# The service's types (T-0211 on) and the view models the screens show.
otaq-core = { path = "../otaq-core" }
otaq-view = { path = "../otaq-view" }
# The types the page reads, serialized as JSON; their TypeScript is generated with ts-rs into `ui/src/generated/`
# (d0075 point 3, UIT-04, see `src/generated.rs`).
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = "12.0.1"
# The service link's tasks (T-0211). The app owns one runtime and hands it to Tauri, so the client's connection, the
# requests and the event forwarding all run on it. Already in the workspace through otaq-core.
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Opens a link clicked in a terminal in the system browser (T-0216). Small and common.
open = "5.4.4"
# The system folder picker of Add project (T-0233, PRJ-01), called from the door only (`src/door.rs`, Rust side; no
# JavaScript permission is granted). Tauri's own dialog plugin, on rfd.
tauri-plugin-dialog = "2.8.2"
# Anonymous usage data, sent only after the user said yes (d0085, `src/usage.rs`): one HTTPS POST to Aptabase. The
# reqwest Tauri already uses, with the OS's own TLS (SChannel, Security.framework, OpenSSL on Linux).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
# A new random session per launch (d0085). Already in the workspace through otaq-core.
uuid = { version = "1.27.0", features = ["v4"] }
# The installed font families for the Terminal font setting and the Nerd Font fallback (d0117 point 5,
# `src/fonts.rs`): reads the OS font folders. MIT.
fontdb = "0.23.0"

[target.'cfg(windows)'.dependencies]
# WebView2's settings, to switch its browser accelerator keys off (UIT-06, `src/door.rs`); Tauri doesn't expose that
# setting. The versions Tauri 2.12 itself uses.
webview2-com = "0.39.1"
windows-core = "0.62.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The app's own defaults, to switch macOS's smart quotes, dashes, text replacement and autocorrect off for the webview
# (#41, #52; `src/door.rs`). MIT; the versions Tauri 2.12 itself uses on macOS.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDictionary", "NSString", "NSUserDefaults"] }

[dev-dependencies]
# The freshness test generates the types into a temporary folder.
tempfile = "3.27.0"

[features]
# Set by the Tauri CLI for release builds: the page is served from the binary, not from the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]
