agents:
  - name: Spec writer
    instructions: |
      Ask one question at a time.
      Write what was agreed into the ticket.

      Never write code.
    model: default
  - name: Rust developer
    instructions: "Follow our error-handling rules: no unwrap in library code."
    model: default
  - name: Quick developer
    model: default
  - name: Validator
    model: default
  - name: Security reviewer
    instructions: |-
      Never edit files.
      Fail on unescaped SQL.
    model: default
  - name: Shipper
    model: default
  - name: Noyan
    model: default
flow:
  - id: product-spec
    name: Product spec
    kind: agent
    agent: Spec writer
    skill: product-spec
    options: [skip]
  - id: dev
    name: Dev
    kind: agent
    agent: Rust developer
    skill: work-ticket
  - id: validate
    name: Validate
    kind: check
    by: agent
    agent: Validator
    skill: validate
    rounds: 3
  - id: security
    name: Security
    kind: check
    by: agent
    agent: Security reviewer
    skill: team-security-review
    rounds: 2
  - id: qa
    name: QA
    kind: check
    by: you
    options: [skip]
    fail_to: Product spec
delivery:
  delivers: pr
  mode: automatic
  agent: Shipper
  skill: open-pr
