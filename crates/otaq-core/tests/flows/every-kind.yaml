agents:
  - name: Griller
    instructions: |
      Ask one question at a time.
      Write what was agreed into the ticket.

      Never write code.
    skills: [grill]
    model: default
  - name: Rust developer
    instructions: "Follow our error-handling rules: no unwrap in library code."
    skills: [work-ticket, commit-compact]
    model: default
  - name: Quick developer
    skills: [work-ticket, commit-compact]
    model: default
  - name: Validator
    skills: [validate]
    model: default
  - name: Security reviewer
    instructions: |-
      Never edit files.
      Fail on unescaped SQL.
    skills: [security-review]
    model: default
  - name: Shipper
    skills: [open-pr]
    model: default
  - name: Noyan
    role: noyan
    skills: [noyan, flow]
    model: default
flow:
  - id: grill
    name: Grill
    kind: agent
    column: own
    agent: Griller
    skill: grill
    options: [skip]
  - id: dev
    name: Dev
    kind: agent
    column: own
    agent: Rust developer
    skill: work-ticket
    options: [Quick developer]
  - id: validate
    name: Validate
    kind: check
    by: agent
    column: with-previous
    agents: [Validator]
    skill: validate
    rounds: 3
  - id: security
    name: Security
    kind: check
    by: agent
    column: own
    agents: [Security reviewer, Validator]
    skill: security-review
    rounds: 2
  - id: qa
    name: QA
    kind: check
    by: you
    column: own
    options: [skip]
    fail_to: Grill
  - id: ship
    name: Done
    kind: delivery
    column: own
    agent: Shipper
    skill: open-pr
    mode: automatic
    delivers: pr
