flow:
  - id: product-spec
    name: Product spec
    kind: agent
    model: default
    skill: tuq:product-spec
    instructions: |-
      Ask one question at a time.
      Write what was agreed into the ticket.

      Never write code.
    options: [skip]
  - id: dev
    name: Dev
    kind: agent
    model: default
    skill: otaq:work-ticket
    instructions: "Follow our error-handling rules: no unwrap in library code."
  - id: validate
    name: Validate
    kind: check
    by: agent
    model: default
    skill: otaq:validate
    rounds: 3
  - id: security
    name: Security
    kind: check
    by: agent
    model: default
    skill: team-security-review
    instructions: |-
      Never edit files.
      Fail on unescaped SQL.
    rounds: 2
  - id: qa
    name: QA
    kind: check
    by: you
    options: [skip]
    fail_to: Product spec
delivery:
  delivers: pr
  mode: automatic
  model: default
  skill: otaq:open-pr
