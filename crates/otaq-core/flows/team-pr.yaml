agents:
  - name: Developer
    model: default
  - name: Validator
    model: default
  - name: Shipper
    model: default
flow:
  - id: dev
    name: Dev
    kind: agent
    column: own
    agent: Developer
    skill: work-ticket
    description: "Builds what the ticket asks for, with its tests, and commits it: every ticket that changes the code needs it."
  - id: validate
    name: Validate
    kind: check
    by: agent
    column: own
    agent: Validator
    skill: validate
    rounds: 3
    description: "Checks the work against the ticket and runs the project's checks, so what Dev missed is caught before the PR opens."
  - id: deliver
    name: Done
    kind: delivery
    column: own
    agent: Shipper
    skill: open-pr
    mode: automatic
    delivers: pr
