agents:
  - name: Developer
    model: default
  - name: Checker
    model: default
  - name: Shipper
    model: default
flow:
  - id: dev
    name: Dev
    kind: agent
    agent: Developer
    skill: work-ticket
    description: "Builds what the ticket asks for, with its tests, and commits it: every ticket that changes the code needs it."
  - id: validate
    name: Validate
    kind: check
    by: agent
    agent: Checker
    skill: validate
    rounds: 3
    description: "Checks the work against the ticket and runs the project's checks, so what Dev missed is caught before the PR opens."
delivery:
  delivers: pr
  mode: automatic
  agent: Shipper
  skill: open-pr
