agents:
  - name: Developer
    model: default
  - name: Validator
    model: default
  - name: Shipper
    model: default
flow:
  - id: dev
    name: Dev
    kind: agent
    column: own
    agent: Developer
    skill: work-ticket
  - id: validate
    name: Validate
    kind: check
    by: agent
    column: own
    agent: Validator
    skill: validate
    rounds: 3
  - id: deliver
    name: Done
    kind: delivery
    column: own
    agent: Shipper
    skill: open-pr
    mode: automatic
    delivers: pr
