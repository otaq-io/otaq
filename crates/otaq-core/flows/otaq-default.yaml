agents:
  - name: Developer
    model: default
  - name: Validator
    model: default
flow:
  - id: dev
    name: Dev
    kind: agent
    column: own
    agent: Developer
    skill: work-ticket
    description: "Builds what the ticket asks for, with its tests, and commits it: every ticket that changes the code needs it."
  - id: validate
    name: Validate
    kind: check
    by: agent
    column: own
    agent: Validator
    skill: validate
    rounds: 3
    description: "Checks the work against the ticket and runs the project's checks, so what Dev missed is caught before anyone reviews it."
  - id: review
    name: Review
    kind: check
    by: you
    column: own
    description: "The user reads the change and passes it, or sends it back with what to fix: their say before it is delivered."
  - id: deliver
    name: Done
    kind: delivery
    column: with-previous
    agent: Developer
    skill: open-pr
    mode: click
    delivers: either
