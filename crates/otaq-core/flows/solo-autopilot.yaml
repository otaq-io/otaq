agents:
  - name: Developer
    skills: [work-ticket, commit]
    model: default
  - name: Validator
    skills: [validate]
    model: default
flow:
  - id: dev
    name: Dev
    kind: agent
    column: own
    agent: Developer
    skill: work-ticket
  - id: validate
    name: Validate
    kind: check
    by: agent
    column: own
    agents: [Validator]
    skill: validate
    rounds: 3
  - id: deliver
    name: Done
    kind: delivery
    column: own
    mode: automatic
    delivers: local
