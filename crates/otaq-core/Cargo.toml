[package]
name = "otaq-core"
description = "Otaq core: domain, store, scheduler, git, sessions and the background service. No UI dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Temporary git repositories for tests (git::testing); also used by the other crates' tests.
tempfile = "3.27.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-util", "net", "process", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.27.0", features = ["v7"] }
portable-pty = "0.9.0"
base64 = "0.22.1"
# A headless terminal emulator: `otaq show <KEY> --terminal` replays a session's scrollback into the screen the
# user sees (SHL-10, d0087).
vt100 = "0.16.2"

# The local clock (localtime_r / localtime_s, mktime); process ancestry of callers (proc_pidinfo on macOS),
# CLI-01.
libc = "0.2.190"
# The models.dev catalog, read once a day (d0086, d0088): the same reqwest the desktop app already uses, with the
# OS's own TLS.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
# Codex's `config.toml` (d0085, d0086): Otaq's own tables edited in place, every other line, comment and order
# kept. Already in the lock through other crates.
toml_edit = "0.25.17"
# The fingerprint of Otaq's copy of an imported workflow skill (WSK-03, d0092): stable across Rust versions, unlike
# std's hasher. Already in the lock through other crates.
sha2 = "0.10.9"
# The flow files (STG-01, d0108): read with serde; Otaq writes them itself (`flow::yaml`). Maintained, pure Rust, no
# unsafe C port; `serde_yaml` is archived.
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS's notification API under Otaq.app's bundle ID (d0090, `attention/notification_center.rs`). The objc2 family
# Tauri already brings, at the same versions; only the parts used.
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSBundle",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSObject",
    "NSRunLoop",
    "NSString",
] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "bitflags",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }


[target.'cfg(windows)'.dependencies]
# Named pipe security (owner-only ACL, client account), process ancestry and job objects on Windows (PLT-02); the
# user's own PATH in the registry and the WM_SETTINGCHANGE broadcast (UPD-07).
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Windows toasts (OS notifications, ATT-11) through the Windows Runtime.
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_System_WinRT",
] }

[dev-dependencies]
# The protocol snapshot check (UPD-03, d0140) reads the protocol's types from the source. All three are already in the
# lock through serde's and tokio's derive macros (MIT OR Apache-2.0); `full` parses whole items.
syn = { version = "2.0.119", features = ["full"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
