[workspace]
resolver = "3"
members = [
    "crates/otaq-core",
    "crates/otaq-cli",
    "crates/otaq-view",
    "crates/otaq-desktop",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "FSL-1.1-MIT"
authors = ["The Otaq Authors"]

# Less debug info, so the test programs link faster and target/ stays smaller (decision 0056, SDD §23.2). Panics and
# backtraces keep their file and line; `profile.test` inherits this.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
